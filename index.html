<style>
/* Layout: one narrow study column; mode chips on top, one question card at a time */
:root{
  --paper:#EAF0EC; --card:#F8FBF9; --ink:#16201C; --muted:#5A6A64; --line:#CFDAD4;
  --jade:#1E7457; --jade-soft:#D8ECE3; --err:#B23B2F; --err-soft:#F5E0DC;
  --f-han:"Noto Serif SC","Songti SC","SimSun",serif;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#101614; --card:#18201D; --ink:#E5EEE9; --muted:#93A49D; --line:#2B3732;
  --jade:#52C39B; --jade-soft:#173A2D; --err:#EE7D70; --err-soft:#3C201C; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#101614; --card:#18201D; --ink:#E5EEE9; --muted:#93A49D; --line:#2B3732;
  --jade:#52C39B; --jade-soft:#173A2D; --err:#EE7D70; --err-soft:#3C201C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header h1{font-size:1.5rem;margin:0;text-wrap:balance;line-height:1.25}
header h1 .h{font-family:var(--f-han);color:var(--jade);margin-right:.35em}
header p{margin:4px 0 0;color:var(--muted);font-size:.92rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-right:4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:.9rem;
  padding:7px 14px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip:focus-visible,.btn:focus-visible,.opt:focus-visible,.tile:focus-visible,.card:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;gap:16px}
.meta{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--jade);transition:width .3s}
.ask{font-size:.9rem;color:var(--muted);margin:0}
.big{font-family:var(--f-han);font-size:3.2rem;line-height:1.2;text-align:center;margin:6px 0}
.sent{font-family:var(--f-han);font-size:1.45rem;line-height:1.7}
.blank{display:inline-block;min-width:2.4em;border-bottom:2px solid var(--jade);text-align:center;color:var(--jade)}
.vi{font-size:1.15rem;font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opt{font:inherit;text-align:left;background:var(--paper);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;min-width:0}
.opt.han{font-family:var(--f-han);font-size:1.25rem}
.opt:hover:not(:disabled){border-color:var(--jade)}
.opt.ok{background:var(--jade-soft);border-color:var(--jade)}
.opt.bad{background:var(--err-soft);border-color:var(--err)}
.opt:disabled{cursor:default}
.note{border-left:3px solid var(--jade);padding:4px 0 4px 12px;font-size:.95rem}
.note.bad{border-color:var(--err)}
.note b{display:block;margin-bottom:2px}
.note .han{font-family:var(--f-han);font-size:1.15rem}
.btn{font:inherit;font-weight:600;border:none;border-radius:10px;padding:12px 18px;cursor:pointer;background:var(--jade);color:var(--card)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.zone{min-height:62px;border:1.5px dashed var(--line);border-radius:10px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.tile{font-family:var(--f-han);font-size:1.25rem;background:var(--paper);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.zone .tile{background:var(--jade-soft);border-color:var(--jade)}
.card{min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-align:center;user-select:none}
.card .py{font-size:1.2rem;color:var(--jade);font-weight:500}
.card .tag{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hint{font-size:.82rem;color:var(--muted);text-align:center}
.score{font-size:3rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.score small{font-size:1.2rem;color:var(--muted);font-weight:500}
.rev{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rev li{border-left:3px solid var(--err);padding:2px 0 2px 10px;font-size:.93rem}
.rev .han{font-family:var(--f-han);font-size:1.1rem}
footer{font-size:.8rem;color:var(--muted)}
.pyl{display:block;font-family:var(--f-body);font-size:.92rem;color:var(--jade);font-weight:500;line-height:1.45;margin:2px 0 4px}
.sent+.pyl{font-size:1rem;margin-top:-8px}
.opy{display:block;font-family:var(--f-body);font-size:.8rem;color:var(--muted);margin-top:2px;line-height:1.35}
.note .han{display:block}
@media (max-width:420px){.opts{grid-template-columns:1fr}.big{font-size:2.8rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const S={lesson:"67",mode:"flash"};
const view=document.getElementById("view");
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pool=a=>a.filter(x=>S.lesson==="all"||S.lesson.includes(String(x.l)));
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e};
function distract(correct,cands,n=3){return shuffle([...new Set(cands.filter(x=>x!==correct))]).slice(0,n)}

/* ---------- session engine ---------- */
let sess=null;
function startSession(items,render,name){
  if(!items.length){view.innerHTML="";view.append(el("div","meta",`<span>${name}</span>`),el("p","hint","Phần Ngữ pháp có câu hỏi cho Bài 3–7. Hãy chọn Bài 6–7, Tất cả hoặc một bài từ 3 đến 7."));return}
  sess={items,render,name,i:0,score:0,wrong:[]};showItem()}
function showItem(){
  const {items,i}=sess;
  if(i>=items.length)return showResult();
  view.innerHTML="";
  const m=el("div","meta",`<span>${sess.name}</span><span>Câu ${i+1}/${items.length} · Đúng ${sess.score}</span>`);
  const bar=el("div","bar","<i></i>");bar.firstChild.style.width=(i/items.length*100)+"%";
  view.append(m,bar);
  const stage=el("div");stage.style.cssText="display:flex;flex-direction:column;gap:16px";view.append(stage);
  sess.render(items[i],stage,(ok,review)=>{
    if(ok)sess.score++;else sess.wrong.push(review);
    m.lastChild.textContent=`Câu ${i+1}/${items.length} · Đúng ${sess.score}`;
    const b=el("button","btn",i+1<items.length?"Câu tiếp →":"Xem kết quả");
    b.onclick=()=>{sess.i++;showItem()};stage.append(b);b.focus();
  });
}
function showResult(){
  const {items,score,wrong}=sess;const pct=Math.round(score/items.length*100);
  view.innerHTML="";
  view.append(el("div","meta",`<span>${sess.name}</span><span>Hoàn thành</span>`));
  view.append(el("div","score",`${score}<small> / ${items.length}</small>`));
  view.append(el("p","hint",pct===100?"Chính xác toàn bộ. Thử chế độ khác nhé.":pct>=70?"Khá tốt. Xem lại các câu sai bên dưới.":"Cần ôn thêm. Xem kỹ các câu sai rồi làm lại."));
  if(wrong.length){view.append(el("p","ask","Câu cần ôn lại"));const ul=el("ul","rev");wrong.forEach(w=>ul.append(el("li","",w)));view.append(ul)}
  const r=el("div","row");const again=el("button","btn","Làm bộ mới");again.onclick=render;r.append(again);view.append(r);
}
/* ---------- pinyin ---------- */
const PP=window.pinyinPro;
try{PP&&PP.customPinyin({还:"hái",长:"cháng",都:"dōu",了:"le",得:"de",眼睛:"yǎn jing",先生:"xiān sheng",时候:"shí hou",回来:"huí lai",衣服:"yī fu",丈夫:"zhàng fu",意思:"yì si",喜欢:"xǐ huan",什么:"shén me",怎么:"zěn me",晚上:"wǎn shang",早上:"zǎo shang",椅子:"yǐ zi",桌子:"zhuō zi",杯子:"bēi zi",儿子:"ér zi",房间:"fáng jiān",漂亮:"piào liang",认识:"rèn shi",休息:"xiū xi",知道:"zhī dào",自行车:"zì xíng chē",姐姐:"jiě jie",听说:"tīng shuō",教室:"jiào shì",好好:"hǎo hāo",公共汽车:"gōng gòng qì chē"})}catch(e){}
function py(text){
  if(!PP)return "";
  const v=VOCAB.find(x=>x.h===text);if(v)return v.p;
  try{
    const chars=[...text],syl=PP.pinyin(text,{type:"array",nonZh:"consecutive"});
    const out=[];let ci=0;
    syl.forEach(s=>{const ch=chars[ci];ci+=/^[一-鿿]$/.test(ch)?1:s.length;
      if(ch==="儿"&&/[这那哪点]/.test(chars[ci-2]||"")&&out.length){out[out.length-1]+="r";return}
      const p={"，":",","。":".","？":"?","！":"!","、":",","——":" —"}[s];
      if(p!=null||/^[,.?!]$/.test(s)){if(out.length)out[out.length-1]+=(p??s);return}
      out.push(s)});
    return out.join(" ");
  }catch(e){return ""}
}
const PY=t=>{const p=py(t);return p?`<span class="pyl">${p}</span>`:""};
function addPy(node,text){const p=py(text);if(p)node.after(el("div","pyl",p))}

function mcq(stage,opts,answer,han,onPick){
  const box=el("div","opts"+(opts.some(o=>o.length>14)?" one":""));
  shuffle(opts).forEach(o=>{const b=el("button","opt"+(han?" han":""));b.textContent=o;
    b.onclick=()=>{box.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.textContent===answer)x.classList.add("ok")});
      const ok=o===answer;if(!ok)b.classList.add("bad");
      if(han)box.querySelectorAll("button").forEach(x=>{const p=py(x.textContent);if(p)x.append(el("span","opy",p))});
      onPick(ok)};box.append(b)});
  stage.append(box);
}

/* ---------- modes ---------- */
function vocabMode(){
  const p=pool(VOCAB);
  const items=shuffle(p).slice(0,15).map(w=>({w,t:Math.floor(Math.random()*3)}));
  startSession(items,({w,t},st,done)=>{
    const rv=`<span class="han">${w.h}</span> ${w.p} — ${w.v}`;
    let opts,ans,han=false;
    if(t===0){st.append(el("p","ask","Nghĩa của từ này là gì?"),el("div","big",w.h));ans=w.v;opts=[ans,...distract(ans,VOCAB.map(x=>x.v))]}
    else if(t===1){st.append(el("p","ask","Chọn chữ Hán đúng:"),el("div","vi",w.v));ans=w.h;han=true;opts=[ans,...distract(ans,VOCAB.map(x=>x.h))]}
    else{st.append(el("p","ask","Chọn phiên âm đúng:"),el("div","big",w.h));ans=w.p;opts=[ans,...distract(ans,VOCAB.map(x=>x.p))]}
    mcq(st,opts,ans,han,ok=>{st.append(el("div","note"+(ok?"":" bad"),`<b>${ok?"Chính xác":"Chưa đúng"}</b>${rv}`));done(ok,rv)});
  },"Trắc nghiệm từ vựng");
}
function fillMode(){
  startSession(shuffle(pool(FILL)),(f,st,done)=>{
    st.append(el("p","ask","Chọn từ điền vào chỗ trống:"));
    const s=el("div","sent",f.s.replace("___",'<span class="blank">？</span>'));st.append(s,el("p","ask",f.v));
    mcq(st,[f.a,...f.d],f.a,true,ok=>{
      s.querySelector(".blank").textContent=f.a;
      const full=f.s.replace("___",f.a);
      st.append(el("div","note"+(ok?"":" bad"),`<b>${ok?"Chính xác":"Đáp án: "+f.a}</b><span class="han">${full}</span>${PY(full)}`));
      done(ok,`<span class="han">${full}</span>${PY(full)}${f.v}`)});
  },"Điền từ vào câu");
}
function qaMode(){
  startSession(shuffle(pool(QA)),(q,st,done)=>{
    const qs=el("div","sent",q.q);st.append(el("p","ask","Chọn câu trả lời phù hợp:"),qs);
    const others=QA.filter(x=>x.g!==q.g&&!GENERIC.has(x.a)).map(x=>x.a);
    const box=el("div");st.append(box);
    mcq(box,[q.a,...distract(q.a,others)],q.a,true,ok=>{
      addPy(qs,q.q);
      st.append(el("div","note"+(ok?"":" bad"),`<b>${ok?"Chính xác":"Chưa đúng"}</b>${q.v}`));
      done(ok,`<span class="han">${q.q}</span>${PY(q.q)}<span class="han">${q.a}</span>${PY(q.a)}${q.v}`)});
    box.firstChild.classList.add("one");
  },"Hỏi – đáp");
}
function arrangeMode(){
  startSession(shuffle(pool(ARR)),(a,st,done)=>{
    st.append(el("p","ask","Sắp xếp thành câu tiếng Trung:"),el("div","vi",a.v));
    const zone=el("div","zone"),bank=el("div","bank");st.append(zone,bank);
    const check=el("button","btn","Kiểm tra");check.disabled=true;st.append(check);
    let tiles=shuffle(a.t.map((t,i)=>({t,i})));
    if(tiles.map(x=>x.t).join("")===a.t.join("")&&tiles.length>1)tiles.reverse();
    tiles.forEach(o=>{const b=el("button","tile");b.textContent=o.t;
      b.onclick=()=>{(b.parentNode===bank?zone:bank).append(b);check.disabled=bank.children.length>0};bank.append(b)});
    check.onclick=()=>{
      const got=[...zone.children].map(x=>x.textContent).join(""),right=a.t.join("");
      const ok=got===right;check.remove();st.querySelectorAll(".tile").forEach(t=>t.disabled=true);
      zone.style.borderColor=ok?"var(--jade)":"var(--err)";
      st.insertBefore(el("div","note"+(ok?"":" bad"),`<b>${ok?"Chính xác":"Câu đúng:"}</b><span class="han">${right}。</span>${PY(right+"。")}`),null);
      done(ok,`<span class="han">${right}。</span>${PY(right+"。")}${a.v}`);
    };
  },"Sắp xếp câu");
}
function writeMode(){
  const items=shuffle(pool(VOCAB)).slice(0,15);
  startSession(items,(w,st,done)=>{
    st.append(el("p","ask","Viết chữ Hán ra giấy, rồi bấm xem đáp án:"),el("div","vi",w.v),el("div","",`<span style="color:var(--jade);font-size:1.2rem;font-weight:500">${w.p}</span>`));
    const show=el("button","btn ghost","Xem chữ Hán");st.append(show);
    show.onclick=()=>{show.remove();st.append(el("div","big",w.h));
      const r=el("div","row"),y=el("button","btn","Mình viết đúng"),n=el("button","btn ghost","Viết sai / quên");
      const fin=ok=>{r.remove();done(ok,`<span class="han">${w.h}</span> ${w.p} — ${w.v}`)};
      y.onclick=()=>fin(true);n.onclick=()=>fin(false);r.append(y,n);st.append(r)};
  },"Tự viết chữ Hán");
}
function flashMode(){
  let list=pool(VOCAB),i=0,flip=false;
  const draw=()=>{
    const w=list[i];view.innerHTML="";
    view.append(el("div","meta",`<span>Thẻ từ · ${list.length} từ</span><span>${i+1}/${list.length}</span>`));
    const c=el("div","card");c.tabIndex=0;c.setAttribute("role","button");
    c.innerHTML=flip?`<span class="tag">${w.c?"Từ mới":"Từ trong bài"} · Bài ${w.l}</span><div class="big">${w.h}</div><span class="py">${w.p}</span><span class="vi">${w.v}</span>`
                    :`<span class="tag">${w.c?"Từ mới":"Từ trong bài"} · Bài ${w.l}</span><div class="big">${w.h}</div><span class="hint">Chạm để xem phiên âm và nghĩa</span>`;
    c.onclick=()=>{flip=!flip;draw()};c.onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();c.click()}};
    const r=el("div","row");
    const pv=el("button","btn ghost","← Trước"),nx=el("button","btn","Tiếp →"),sh=el("button","btn ghost","Trộn thẻ");
    pv.onclick=()=>{i=(i-1+list.length)%list.length;flip=false;draw()};
    nx.onclick=()=>{i=(i+1)%list.length;flip=false;draw()};
    sh.onclick=()=>{list=shuffle(list);i=0;flip=false;draw()};
    r.append(pv,nx,sh);view.append(c,r);
  };draw();
}
function gramMode(){
  startSession(shuffle(pool(GRAM)),(g,st,done)=>{
    let s=null;
    if(g.q)st.append(el("p","ask","Chọn đáp án đúng:"),el("div","vi",g.q));
    else{st.append(el("p","ask","Chọn từ đúng ngữ pháp:"));s=el("div","sent",g.s.replace("___",'<span class="blank">？</span>'));st.append(s)}
    mcq(st,[g.a,...g.d],g.a,true,ok=>{
      const full=g.q?g.a:g.s.replace("___",g.a);
      if(s)s.querySelector(".blank").textContent=g.a;
      st.append(el("div","note"+(ok?"":" bad"),`<b>${ok?"Chính xác":"Đáp án: "+g.a}</b><span class="han">${full}</span>${PY(full)}${g.e}`));
      done(ok,(g.q?g.q+"<br>":"")+`<span class="han">${full}</span>${PY(full)}${g.e}`)});
  },"Ngữ pháp");
}
const MODES={flash:flashMode,vocab:vocabMode,fill:fillMode,arrange:arrangeMode,qa:qaMode,gram:gramMode,write:writeMode};
function render(){MODES[S.mode]()}
function bind(id,key,attr){document.getElementById(id).addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  S[key]=b.dataset[attr];document.querySelectorAll(`#${id} .chip`).forEach(x=>x.setAttribute("aria-pressed",x===b));render()})}
bind("lessons","lesson","l");bind("modes","mode","m");
render();
</script>
